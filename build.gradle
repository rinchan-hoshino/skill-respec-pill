plugins {
    id 'java'
    id 'net.fabricmc.fabric-loom' version '1.15.5' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

group = mod_group_id
version = mod_version

repositories {
    mavenCentral()
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

sourceSets {
    main {
        java {
            srcDir 'common/src/main/java'
            include 'dev/rinchan/skillrespecpill/api/internal/**'
            include 'dev/rinchan/skillrespecpill/graph/GraphException.java'
            include 'dev/rinchan/skillrespecpill/graph/SkillGraph.java'
            include 'dev/rinchan/skillrespecpill/policy/SkillPolicy.java'
            include 'dev/rinchan/skillrespecpill/service/PointMutationContext.java'
            include 'dev/rinchan/skillrespecpill/state/DefaultGrantState.java'
        }
    }
    test.java.srcDir 'common/src/test/java'
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    inputs.files(fileTree('common/src/main')).withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.named('jar') {
    enabled = false
}

subprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://api.modrinth.com/maven' }
        maven { url = 'https://www.cursemaven.com' }
    }

    plugins.withType(JavaPlugin).configureEach {
        java.toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version as int)
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

tasks.register('quickCompile') {
    group = 'verification'
    description = 'Compiles the focused pure core and both loader source sets without launching Minecraft.'
    dependsOn tasks.named('compileJava'), ':fabric:compileJava', ':neoforge:compileJava'
}

tasks.register('dualBuild') {
    group = 'build'
    description = 'Builds the Fabric and NeoForge distributable JARs.'
    dependsOn ':fabric:remapJar', ':neoforge:jar'
}

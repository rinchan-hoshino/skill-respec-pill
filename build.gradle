plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://cursemaven.com' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

neoForge {
    version = neo_version
    mods {
        skill_respec_pill {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "curse.maven:puffish-skills-835091:${puffish_skills_file_id}"
    implementation "maven.modrinth:rinlib:${rinlib_version}"
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

def packagedLicenseName = "LICENSE_${mod_id}"

tasks.named('jar', Jar) {
    from('LICENSE') {
        rename { packagedLicenseName }
    }
    manifest {
        attributes(
                'Specification-Title': mod_id,
                'Specification-Version': mod_version,
                'Implementation-Title': mod_id,
                'Implementation-Version': mod_version)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.named('jar')
            artifactId = mod_id
        }
    }
}
